<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  <style>
    a,
    button,
    input,
    select,
    h1,
    h2,
    h3,
    h4,
    h5,
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
      text-decoration: none;
      background: none;
      -webkit-font-smoothing: antialiased;
    }

    menu, ol, ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }
  </style>
  <title>RunSPB</title>
</head>
<body>
  <div class="div">
    <header class="header" id="top">
      <a class="run-spb3 interactive-link" href="#top" aria-label="Перейти в начало страницы">
        <span class="run-spb2">
          <span>
            <span class="run-spb-2-span3">Run</span>
            <span class="run-spb-2-span4">SPB</span>
          </span>
        </span>
      </a>

      <button class="frame-3 burger-button" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobile-menu">
        <img class="icon-burger" src="icon-burger0.svg" alt="">
      </button>

      <div class="mobile-menu" id="mobile-menu" hidden>
        <a class="mobile-menu-action" href="../Страница входа/page2.html">Войти</a>
        <a class="mobile-menu-action mobile-menu-action-primary" href="../Страница входа/page2.html">Регистрация</a>
      </div>
    </header>

    <div class="rectangle-8"></div>
    <img class="image-33" src="image-330.png" alt="Беговая тренировка на природе">
    <section class="hero-content" id="about-section">
      <h1 class="div2">Всё для бега в Санкт-Петербурге</h1>
      <a class="button-primary-default interactive-button" href="../Маршрут/index.html">Изучить карту</a>
    </section>

    <section id="clubs-section" class="section-anchor" aria-labelledby="clubs-title">
      <div class="rectangle-82"></div>
      <div class="ellipse-2"></div>
      <div class="rectangle-11"></div>
      <div class="rectangle-12"></div>
      <img class="image-37" src="image-370.png" alt="Сообщество бегунов">
      <div class="rectangle-83"></div>
      <div class="ellipse-22"></div>
      <div class="rectangle-112"></div>
      <div class="rectangle-122"></div>
      <img class="image-35" src="image-350.png" alt="Участники забега в центре города">
      <h2 class="div3" id="clubs-title">Выбирай компанию для бега</h2>
    </section>

    <section id="events-section" class="section-anchor" aria-labelledby="events-title">
      <h2 class="div4" id="events-title">Ближайшие события</h2>
      <button class="month-button month-december" type="button" data-month="may">Май</button>
      <button class="month-button month-january" type="button" data-month="june">Июнь</button>
      <button class="month-button month-february" type="button" data-month="july">Июль</button>
      <img class="waves" src="waves-right.png" alt="">
      <img class="waves2" src="waves-left.png" alt="">
      <img class="arrow-between" src="strelka.png" alt="">
      <div class="event-details" aria-live="polite" hidden>
        <p class="event-month-label"></p>
        <p class="event-title"></p>
        <p class="event-description"></p>
      </div>
    </section>

    <section id="join-section" class="section-anchor" aria-labelledby="join-title">
      <h2 class="div8" id="join-title">Присоединяйся к нам</h2>
      <div class="_100">
        <span>
          <span class="_100-span">
            И получай до 100+ контента
            <br>
          </span>
          <ul class="_100-span2">
            <li>корзина для начинающих</li>
            <li>чеклисты</li>
            <li>подборка маршрутов по ЛО</li>
            <li>и многое другое</li>
          </ul>
        </span>
      </div>
      <a class="join-button" href="../Страница входа/page2.html">Регистрация</a>
      <img
        class="_06-f-324-a-1-ab-129-dd-83-f-9-c-4-aa-5-b-7-d-7-e-54-c-1"
        src="_06-f-324-a-1-ab-129-dd-83-f-9-c-4-aa-5-b-7-d-7-e-54-c-10.png"
        alt="Иллюстрация беговых кроссовок"
      >
      <div class="text-1"></div>
    </section>

    <footer class="site-footer" id="footer">
      <a class="brand brand-footer" href="./page1.html" aria-label="На главную">
        <span class="brand-run">Run</span><span class="brand-spb">SPB</span>
      </a>
      <div class="footer-social">
        <p class="footer-title">Мы в соц сетях</p>
        <div class="social-icons">
          <a class="social-link" href="https://t.me/" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
            <img src="_81-e-9125-dfe-9-fe-6161-ba-1-aa-96-c-4876288-10.png" alt="">
          </a>
          <a class="social-link" href="https://vk.com/" target="_blank" rel="noopener noreferrer" aria-label="VK">
            <img src="f-74-dcd-9139-ebf-8-c-14-daf-235-cdf-026-c-7-c-10.png" alt="">
          </a>
          <a class="social-link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <img src="image-10.png" alt="">
          </a>
        </div>
      </div>
    </footer>
  </div>

  <script>
    const burgerButton = document.querySelector('.burger-button');
    const mobileMenu = document.getElementById('mobile-menu');
    const monthButtons = document.querySelectorAll('.month-button');
    const monthLabel = document.querySelector('.event-month-label');
    const eventTitle = document.querySelector('.event-title');
    const eventDescription = document.querySelector('.event-description');
    const eventDetails = document.querySelector('.event-details');

    const monthContent = {
      may: {
        month: 'Май',
        title: 'Ночная пробежка по лесной тропе',
        description: 'Спокойный темп, фонарики и короткий маршрут для знакомства с сообществом.'
      },
      june: {
        month: 'Июнь',
        title: 'Благотворительный марафон от издания',
        description: 'Городской старт в поддержку доброй инициативы: открытая регистрация, несколько дистанций и большая общая встреча после финиша.'
      },
      july: {
        month: 'Июль',
        title: 'Кросс-бег на Лесной',
        description: 'Летняя трасса по зелёному маршруту: пересечённые участки, бодрый темп и тренировка на выносливость в компании.'
      }
    };

    function setMobileMenuState(isOpen) {
      burgerButton.setAttribute('aria-expanded', String(isOpen));
      mobileMenu.hidden = !isOpen;
      mobileMenu.classList.toggle('is-open', isOpen);
    }

    burgerButton.addEventListener('click', () => {
      const isOpen = burgerButton.getAttribute('aria-expanded') === 'true';
      setMobileMenuState(!isOpen);
    });

    mobileMenu.querySelectorAll('a, button').forEach((item) => {
      item.addEventListener('click', () => setMobileMenuState(false));
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        setMobileMenuState(false);
      }
    });

    monthButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const month = monthContent[button.dataset.month];
        monthButtons.forEach((item) => item.classList.remove('is-active'));
        button.classList.add('is-active');
        eventDetails.hidden = false;
        monthLabel.textContent = month.month;
        eventTitle.textContent = month.title;
        eventDescription.textContent = month.description;
      });
    });
  </script>
</body>
</html>
