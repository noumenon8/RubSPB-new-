<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  <title>RunSPB - Вход</title>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand brand-header" href="../Главная страница/page1.html" aria-label="На главную">
        <span class="brand-run">Run</span><span class="brand-spb">SPB</span>
      </a>

      <nav class="desktop-nav" aria-label="&#1044;&#1077;&#1081;&#1089;&#1090;&#1074;&#1080;&#1103; &#1087;&#1088;&#1086;&#1092;&#1080;&#1083;&#1103;">
        <a class="profile-link" href="../%D0%9F%D1%80%D0%BE%D1%84%D0%B8%D0%BB%D1%8C/profile.html" aria-label="&#1055;&#1088;&#1086;&#1092;&#1080;&#1083;&#1100;">
          <span class="profile-icon" aria-hidden="true"></span>
        </a>
        <a class="auth-link login-button" href="./page2.html">&#1042;&#1086;&#1081;&#1090;&#1080;</a>
        <a class="register-chip" href="./page2.html">&#1056;&#1077;&#1075;&#1080;&#1089;&#1090;&#1088;&#1072;&#1094;&#1080;&#1103;</a>
      </nav>

      <button class="burger-button" type="button" aria-label="&#1054;&#1090;&#1082;&#1088;&#1099;&#1090;&#1100; &#1084;&#1077;&#1085;&#1102;" aria-expanded="false" aria-controls="mobile-menu">
        <img class="burger-icon" src="icon-burger0.svg" alt="">
      </button>

      <div class="mobile-menu" id="mobile-menu" hidden>
        <a class="mobile-menu-link" href="../%D0%93%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F%20%D1%81%D1%82%D1%80%D0%B0%D0%BD%D0%B8%D1%86%D0%B0/page1.html">&#1043;&#1083;&#1072;&#1074;&#1085;&#1072;&#1103;</a>
        <a class="mobile-menu-link" href="../%D0%9C%D0%B0%D1%80%D1%88%D1%80%D1%83%D1%82/index.html">&#1052;&#1072;&#1088;&#1096;&#1088;&#1091;&#1090;&#1099;</a>
        <a class="mobile-menu-link" href="../%D0%9C%D0%B5%D1%80%D0%BE%D0%BF%D1%80%D0%B8%D1%8F%D1%82%D0%B8%D1%8F/index.html">&#1052;&#1077;&#1088;&#1086;&#1087;&#1088;&#1080;&#1103;&#1090;&#1080;&#1103;</a>
        <a class="mobile-menu-link mobile-menu-profile" href="../%D0%9F%D1%80%D0%BE%D1%84%D0%B8%D0%BB%D1%8C/profile.html">
          <span class="profile-icon" aria-hidden="true"></span>
          &#1055;&#1088;&#1086;&#1092;&#1080;&#1083;&#1100;
        </a>
        <a class="mobile-menu-link" href="./page2.html">&#1042;&#1086;&#1081;&#1090;&#1080;</a>
        <a class="mobile-menu-link mobile-menu-link-primary" href="./page2.html">&#1056;&#1077;&#1075;&#1080;&#1089;&#1090;&#1088;&#1072;&#1094;&#1080;&#1103;</a>
      </div>
    </header>

    <main class="auth-layout">
      <section class="art-panel">
        <img class="art-image" src="d-6-ec-5-aa-9-da-169429-b-739022-c-63-e-79566-10.png" alt="Иллюстрация бегуна">
      </section>

      <section class="auth-card">
        <button class="mode-link" type="button" id="mode-switch">Создать аккаунт</button>
        <p class="auth-kicker">Профиль RunSPB</p>
        <h1 class="auth-title" id="auth-title">Войти</h1>

        <form class="auth-form" id="auth-form">
          <label class="field" id="name-field" hidden>
            <span class="field-label">Имя</span>
            <input id="name-input" type="text" name="name" placeholder="Например: Арсений">
          </label>

          <label class="field">
            <span class="field-label">E-mail / Номер телефона</span>
            <input id="email-input" type="text" name="email" placeholder="runner@example.com" required>
          </label>

          <label class="field field-password">
            <span class="field-label">Пароль</span>
            <input id="password-input" type="password" name="password" placeholder="Минимум 6 символов" required minlength="6">
            <button class="password-toggle" type="button" aria-label="Показать или скрыть пароль">
              <img src="icon-password-hide0.svg" alt="">
            </button>
          </label>

          <button class="forgot-link" type="button" id="forgot-button">Забыли пароль?</button>

          <button class="submit-button" type="submit" id="submit-button">Вход</button>
        </form>

        <p class="status-message" id="status-message" aria-live="polite"></p>

        <div class="helper-links">
          <a class="helper-link" href="../Главная страница/page1.html">Вернуться на главную</a>
          <a class="helper-link" href="../Маршрут/index.html">Смотреть маршруты</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <a class="brand brand-footer" href="../Главная страница/page1.html" aria-label="На главную">
        <span class="brand-run">Run</span><span class="brand-spb">SPB</span>
      </a>

      <div class="footer-social">
        <p class="footer-title">Мы в соц сетях</p>
        <div class="social-icons">
          <a class="social-link" href="https://t.me/" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
            <img src="_81-e-9125-dfe-9-fe-6161-ba-1-aa-96-c-4876288-10.png" alt="">
          </a>
          <a class="social-link" href="https://vk.com/" target="_blank" rel="noopener noreferrer" aria-label="VK">
            <img src="f-74-dcd-9139-ebf-8-c-14-daf-235-cdf-026-c-7-c-10.png" alt="">
          </a>
          <a class="social-link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <img src="image-10.png" alt="">
          </a>
        </div>
      </div>
    </footer>
  </div>

  <script>
    const PROFILE_STORAGE_KEY = 'runspb-user-profile';
    const modeSwitch = document.getElementById('mode-switch');
    const authTitle = document.getElementById('auth-title');
    const submitButton = document.getElementById('submit-button');
    const authForm = document.getElementById('auth-form');
    const statusMessage = document.getElementById('status-message');
    const passwordInput = document.getElementById('password-input');
    const passwordToggle = document.querySelector('.password-toggle');
    const forgotButton = document.getElementById('forgot-button');
    const emailInput = document.getElementById('email-input');
    const nameField = document.getElementById('name-field');
    const nameInput = document.getElementById('name-input');
    const burgerButton = document.querySelector('.burger-button');
    const mobileMenu = document.getElementById('mobile-menu');

    let isRegisterMode = false;

    function readProfile() {
      try {
        const rawProfile = localStorage.getItem(PROFILE_STORAGE_KEY);
        return rawProfile ? JSON.parse(rawProfile) : null;
      } catch (error) {
        return null;
      }
    }

    function saveProfile(profile) {
      localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profile));
    }

    function resolveDisplayName() {
      const manualName = nameInput.value.trim();
      if (manualName) {
        return manualName;
      }

      const emailValue = emailInput.value.trim();
      if (!emailValue) {
        return 'Runner';
      }

      return emailValue.split('@')[0] || emailValue;
    }

    function syncMode() {
      authTitle.textContent = isRegisterMode ? 'Регистрация' : 'Войти';
      submitButton.textContent = isRegisterMode ? 'Создать аккаунт' : 'Вход';
      modeSwitch.textContent = isRegisterMode ? 'Уже есть аккаунт?' : 'Создать аккаунт';
      forgotButton.hidden = isRegisterMode;
      nameField.hidden = !isRegisterMode;
      nameInput.required = isRegisterMode;
      if (!isRegisterMode) {
        nameInput.value = '';
      }
      statusMessage.textContent = '';
    }

    function setMobileMenuState(isOpen) {
      burgerButton.setAttribute('aria-expanded', String(isOpen));
      mobileMenu.hidden = !isOpen;
      mobileMenu.classList.toggle('is-open', isOpen);
    }

    modeSwitch.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      syncMode();
    });

    burgerButton.addEventListener('click', () => {
      const isOpen = burgerButton.getAttribute('aria-expanded') === 'true';
      setMobileMenuState(!isOpen);
    });

    mobileMenu.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', () => setMobileMenuState(false));
    });

    passwordToggle.addEventListener('click', () => {
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        setMobileMenuState(false);
      }
    });

    forgotButton.addEventListener('click', () => {
      statusMessage.textContent = 'Для демо-версии достаточно ввести любые корректные данные и войти заново.';
    });

    authForm.addEventListener('submit', (event) => {
      event.preventDefault();

      if (!authForm.reportValidity()) {
        return;
      }

      const emailValue = emailInput.value.trim();
      if (emailValue.length < 3) {
        statusMessage.textContent = 'Добавь e-mail или номер телефона.';
        return;
      }

      const existingProfile = readProfile();

      if (isRegisterMode) {
        if (existingProfile && existingProfile.email === emailValue) {
          statusMessage.textContent = 'Профиль с таким e-mail уже есть. Попробуй войти.';
          return;
        }

        const profile = {
          id: `runspb-${Date.now()}`,
          email: emailValue,
          displayName: resolveDisplayName(),
          createdAt: new Date().toISOString(),
          lastLoginAt: new Date().toISOString(),
          savedRoutes: existingProfile && Array.isArray(existingProfile.savedRoutes)
            ? existingProfile.savedRoutes
            : []
        };

        saveProfile(profile);
        statusMessage.textContent = 'Аккаунт создан. Открываем профиль...';
      } else {
        if (!existingProfile || existingProfile.email !== emailValue) {
          statusMessage.textContent = 'Профиль не найден. Сначала создай аккаунт.';
          return;
        }

        existingProfile.lastLoginAt = new Date().toISOString();
        saveProfile(existingProfile);
        statusMessage.textContent = 'Вход выполнен. Открываем профиль...';
      }

      setTimeout(() => {
        window.location.href = '../Профиль/profile.html';
      }, 900);
    });

    syncMode();
  </script>
</body>
</html>
